<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schach · Chess-game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/Chess-game/assets/index-0olGSeH8.js"></script>
    <link rel="stylesheet" crossorigin href="/Chess-game/assets/index-CKrXSQ-a.css">
  </head>
  <body>
    <div id="app">
      <header class="header">
        <div class="brand">
          <span class="brand-icon" aria-hidden="true">♔</span>
          <h1>Schach</h1>
        </div>
        <p class="tagline">Zwei Spieler · Regeln nach chess.js</p>
      </header>

      <main class="layout">
        <section class="board-panel" aria-label="Schachbrett">
          <div class="board-wrap">
            <div id="board" class="board" role="grid" aria-label="8×8 Schachbrett"></div>
          </div>
        </section>

        <aside class="sidebar">
          <div class="status-card">
            <p class="status-label">Am Zug</p>
            <p id="turn-indicator" class="turn-indicator">Weiß</p>
            <p id="game-status" class="game-status" role="status"></p>
          </div>

          <div class="controls">
            <button type="button" id="btn-undo" class="btn btn-secondary" disabled>
              Rückgängig
            </button>
            <button type="button" id="btn-new" class="btn btn-primary">Neue Partie</button>
          </div>

          <div class="moves-card">
            <h2>Züge</h2>
            <ol id="move-list" class="move-list"></ol>
          </div>

          <p class="hint">
            Figur anklicken, dann Zielfeld. Grün = legal, Gelb = Schach.
          </p>
        </aside>
      </main>
    </div>
  </body>
</html>
